    <script>
      // Safe guard for environments/sandboxes where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || !desc.set) {
            var _activeFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _activeFetch;
              },
              set: function(newFetch) {
                _activeFetch = newFetch;
              }
            });
          }
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var pDesc = Object.getOwnPropertyDescriptor(proto, 'fetch');
              if (pDesc && !pDesc.set) {
                var _pFetch = proto.fetch;
                Object.defineProperty(proto, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() { return _pFetch; },
                  set: function(v) { _pFetch = v; }
                });
              }
            }
          } catch (err) {}
        }
      })();
    </script>
